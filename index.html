<!DOCTYPE html>

<meta property="og:title" content="Mama Picks Kenya | Pregnancy and baby finds from Jumia">

<body data-page="home">

<div id="site-header"></div>

<header class="hero">
  <div class="wrap hero-grid">
    <div>
      <h1 data-t>Handpicked finds for bump, birth and baby</h1>
      <p class="lede" data-t>Trending and hard-to-find items for mums in Kenya, all available on Jumia. Tap a product to see the price and order.</p>
      <label class="search">
        <span class="sr-only">Search products</span>
        <input type="search" id="q" data-t-placeholder="Search pillows, bras, carriers..." placeholder="Search pillows, bras, carriers..." autocomplete="off">
      </label>
      <ul class="trust">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><span data-t>Handpicked by us</span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><span data-t>Shop securely on Jumia</span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg><span data-t>Free to use</span></li>
      </ul>
    </div>

    <div class="hero-art" aria-hidden="true">
      <svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 170c0-86 70-140 150-140s140 50 140 130-50 150-150 150S60 256 60 170z" fill="#d6ebe1"/>
        <circle cx="318" cy="70" r="46" fill="#fbd5df"/>
        <circle cx="82" cy="276" r="36" fill="#f6d86b"/>
        <g transform="rotate(-8 190 170)"><rect x="96" y="58" width="190" height="232" rx="22" fill="#ffffff" opacity="0.75"/></g>
        <rect x="112" y="52" width="190" height="236" rx="22" fill="#ffffff" stroke="#d3e2db" stroke-width="2"/>
        <rect x="130" y="70" width="154" height="112" rx="14" fill="#fde9ef"/>
        <text x="207" y="148" font-size="62" text-anchor="middle">🍼</text>
        <circle cx="262" cy="92" r="15" fill="#ffffff"/>
        <path transform="translate(252.5 82.5) scale(.8)" fill="#e0476f" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        <rect x="130" y="198" width="112" height="10" rx="5" fill="#d3e2db"/>
        <rect x="130" y="216" width="80" height="8" rx="4" fill="#e6efea"/>
        <rect x="130" y="244" width="154" height="30" rx="15" fill="#e0476f"/>
        <rect x="170" y="256" width="74" height="7" rx="3.5" fill="#ffffff"/>
      </svg>
    </div>
  </div>
</header>

<div class="categories-bar">
  <div class="categories" id="categories" role="group" aria-label="Filter by category"></div>
</div>

<main>
  <div class="wrap">
    <section class="picks" id="picks" hidden aria-labelledby="picksTitle">
      <h2 id="picksTitle" data-t>Picks of the week</h2>
      <div class="strip" id="strip"></div>
    </section>

    <div class="notice" id="notice" hidden></div>

    <div class="toolbar">
      <p class="count" id="count" aria-live="polite"></p>
      <label class="sort"><span data-t>Sort by</span>
        <select id="sort">
          <option value="featured">Featured</option>
          <option value="newest">Newest</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </label>
    </div>
    <div class="budgets" id="budgets" role="group" aria-label="Filter by price"></div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<div id="site-footer"></div>

<aside class="ad-rail left" id="adLeft" aria-label="Advertisement"></aside>
<aside class="ad-rail right" id="adRight" aria-label="Advertisement"></aside>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/features.js"></script>
<script src="js/shared.js"></script>
<script src="js/app.js"></script>
</body>
</html>
